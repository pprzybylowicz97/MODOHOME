<div
	class="modohome-catalog"
	id="modohome-catalog-1"
	data-modohome-catalog
	data-config="{&quot;perPage&quot;:12,&quot;loadMore&quot;:false}"
	style="--modohome-catalog-cols-desktop:4"
>
			<h2 class="modohome-catalog-heading">Katalog MODOhome</h2>
	
	
			<div class="modohome-catalog-toolbar">
							<div class="modohome-catalog-search">
					<label class="screen-reader-text" for="modohome-catalog-1-search">
						Szukaj produktów					</label>
					<input
						type="search"
						id="modohome-catalog-1-search"
						class="modohome-catalog-search-input"
						data-modohome-search
						placeholder="Szukaj produktu…"
						autocomplete="off"
					/>
				</div>
			
							<div class="modohome-catalog-sort">
					<label class="screen-reader-text" for="modohome-catalog-1-sort">
						Sortowanie					</label>
					<select id="modohome-catalog-1-sort" class="modohome-catalog-select" data-modohome-sort>
						<option value="date"  selected='selected'>Najnowsze</option>
						<option value="price_asc" >Cena rosnąco</option>
						<option value="price_desc" >Cena malejąco</option>
					</select>
				</div>
					</div>
	
			<div class="modohome-catalog-filterbar">
		<div class="modohome-catalog-filters" role="group" aria-label="Filtruj po kategorii">
			<button type="button" class="modohome-catalog-filter is-active" data-modohome-filter="" aria-pressed="true">
				Wszystkie			</button>

										</div>

			<p class="modohome-catalog-count" data-modohome-count>
				94 produktów			</p>
		</div>
	
	<div class="modohome-catalog-status" data-modohome-status role="status" aria-live="polite"></div>

	<div class="modohome-catalog-grid" data-modohome-grid>
		<article
	class="modohome-catalog-card modohome-catalog-card--reserved"
	data-modohome-card
	data-product-id="42"
>
			<button
			type="button"
			class="modohome-catalog-card-link"
			data-modohome-open="42"
			aria-haspopup="dialog"
		>
	
		<div class="modohome-catalog-card-media">
							<img
					class="modohome-catalog-card-image"
					src="https://example.test/img/5-medium_large.jpg"
					alt="Krzesło &quot;Riviera&quot; &lt;script&gt;alert(1)&lt;/script&gt;"
					loading="lazy"
					decoding="async"
				/>
			
			<div class="modohome-catalog-card-flags">
									<span class="modohome-catalog-badge modohome-catalog-badge--promo">
						Promocja					</span>
				
							</div>

							<span class="modohome-catalog-status-tag modohome-catalog-status-tag--reserved">
					Zarezerwowany				</span>
					</div>

		<div class="modohome-catalog-card-body">
							<p class="modohome-catalog-card-category">
					Krzesła				</p>
			
			<h3 class="modohome-catalog-card-title">Krzesło &quot;Riviera&quot; &lt;script&gt;alert(1)&lt;/script&gt;</h3>

			
			<p class="modohome-catalog-card-prices">
				<span class="modohome-catalog-price">1 299,90 zł</span>

									<span class="modohome-catalog-price-old">1 599 zł</span>
							</p>

			
					</div>

			</button>
	</article>
	</div>

	<p class="modohome-catalog-empty" data-modohome-empty hidden>
		Nie znaleziono produktów.	</p>

			<nav class="modohome-catalog-pagination" data-modohome-pagination aria-label="Strony katalogu">
			<button type="button" class="modohome-catalog-page is-current" data-modohome-page="1" aria-current="page">1</button><button type="button" class="modohome-catalog-page" data-modohome-page="2">2</button><button type="button" class="modohome-catalog-page" data-modohome-page="3">3</button><span class="modohome-catalog-page modohome-catalog-page--gap" aria-hidden="true">…</span><button type="button" class="modohome-catalog-page" data-modohome-page="8">8</button>		</nav>
	</div>
